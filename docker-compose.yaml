version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthcare-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: docker/auth-service.Dockerfile
    container_name: healthcare-auth-service
    environment:
      DATABASE_URL_AUTH: postgresql://postgres:postgres@postgres:5432/auth_db
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      AUTH_HTTP_PORT: 3001
      AUTH_TCP_PORT: 3003
    ports:
      - "3001:3001"
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy --schema=prisma/auth-service/schema.prisma && node dist/apps/auth-service/main"

  redis:
    image: redis:7-alpine
    container_name: healthcare-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  schedule-service:
    build:
      context: .
      dockerfile: docker/schedule-service.Dockerfile
    container_name: healthcare-schedule-service
    environment:
      DATABASE_URL_SCHEDULE: postgresql://postgres:postgres@postgres:5432/schedule_db
      AUTH_SERVICE_HOST: auth-service
      AUTH_TCP_PORT: 3003
      SCHEDULE_HTTP_PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: sandbox.smtp.mailtrap.io
      MAIL_PORT: 2525
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: noreply@healthcare.com
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy --schema=prisma/schedule-service/schema.prisma && node dist/apps/schedule-service/main"

volumes:
  postgres_data:
